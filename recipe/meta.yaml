{% set name = "ipyparallel" %}
{% set version = "9.2.0" %}
{% set deselect_tests = "" %}
{% set deselect_tests = " --deselect=test_cluster.py::test_cluster_repr" %}  # [unix]

#E   PermissionError: [Errno 13] Permission denied: '/tmp/log/ipcontroller-test-106717.log'
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2b31bb4e94708e7ffb4ee6501d7f5f664df7e1c4c572e91e9e0d12484c6a6910

build:
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation --ignore-installed .
  entry_points:
    - ipcluster = ipyparallel.cluster.app:main
    - ipcontroller = ipyparallel.controller.app:main
    - ipengine = ipyparallel.engine.app:main
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling >=0.25
    - jupyterlab ==4.*
  run:
    - python
    - decorator
    - pyzmq >=25
    - traitlets >=5
    - ipython >=5
    - jupyter_client >=7
    - ipykernel >=6.9.1
    - tornado >=6.1
    - psutil
    - python-dateutil >=2.1
    - tqdm
  run_constrained:
    - jupyterlab >=3

test:
  imports:
    - ipyparallel
    - ipyparallel.apps
    - ipyparallel.client
    - ipyparallel.controller
    - ipyparallel.engine
    - ipyparallel.serialize
  commands:
    - pip check
    - echo on  # [win]
    - ipcluster -h
    - ipcontroller -h
    - ipengine -h
    - jupyter labextension list
    - jupyter server extension list
    - jupyter nbclassic extension list
    - jupyter labextension list 1>labextensions 2>&1
    - jupyter server extension list 1>server_extensions 2>&1
    - jupyter nbclassic extension list 1>nbclassic_extensions 2>&1
    # Validate extensions are registered
    - python -c "import re, pathlib; assert re.findall(r'ipyparallel-labextension.*[Oo][Kk]', pathlib.Path('labextensions').read_text())"
    - python -c "import re, pathlib; assert re.findall(r'ipyparallel.*[Oo][Kk]', pathlib.Path('server_extensions').read_text())"
    - python -c "import re, pathlib; assert re.findall(r'ipyparallel.*[Oo][Kk]', pathlib.Path('nbclassic_extensions').read_text())"
    # Run test suite
    - pytest --pyargs --asyncio-mode=auto ipyparallel.tests {{ deselect_tests }}
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - jupyterlab ==4.*
    - jupyter_server <3
    - notebook
    - nbclassic
    - msys2-grep  # [win]
    - mpi4py  # [win]

about:
  home: https://github.com/ipython/ipyparallel
  license: BSD-3-Clause
  license_file: COPYING.md
  license_family: BSD
  summary: Interactive Parallel Computing with IPython
  description: |
    IPython Parallel (ipyparallel) is a Python package and collection of CLI scripts
    for controlling clusters of IPython processes, built on the Jupyter protocol.
  doc_url: https://ipyparallel.readthedocs.io
  dev_url: https://github.com/ipython/ipyparallel

extra:
  recipe-maintainers:
    - jakirkham
    - minrk
